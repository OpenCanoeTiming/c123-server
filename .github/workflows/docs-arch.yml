name: Architecture docs

on:
  pull_request:
    paths:
      - 'docs/arch/**'
      - 'scripts/check-obligations.js'
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  obligations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: CLIENT-OBLIGATIONS.md is in step with its sources
        run: node scripts/check-obligations.js "origin/${{ github.base_ref }}"
        env:
          OBLIGATIONS_ACK: ${{ contains(github.event.pull_request.labels.*.name, 'obligations-unchanged') && '1' || '0' }}
